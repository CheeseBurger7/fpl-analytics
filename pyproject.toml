[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl"
version = "0.1.0"
description = "Fantasy Premier League analytics platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
]

[project.optional-dependencies]
optimize = ["scipy>=1.11"]
dev = ["pytest>=8", "ruff>=0.5", "scipy>=1.11"]

[project.scripts]
fpl = "fpl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
